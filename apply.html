<!DOCTYPE html>

<html lang="en">

<head>

    ```
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply Job | JOBNOVA</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            min-height: 100vh;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            color: #2563eb;
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #0f172a;
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 15px;
            color: #0f172a;
            font-size: 20px;
        }

        .job-info {
            background: #eff6ff;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .job-info p {
            margin: 8px 0;
            color: #475569;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #334155;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .questions-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .question {
            margin-bottom: 18px;
        }

        .question:last-child {
            margin-bottom: 0;
        }

        .question label {
            margin-top: 0;
            color: #1e293b;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .success {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            text-align: center;
        }

    </style>
    ```

</head>

<body>

<nav class="navbar">

    ```
    <div class="logo">
        💼 JOBNOVA
    </div>

    <a href="jobs.html" class="back">
        ← Back to Jobs
    </a>
    ```

</nav>

<div class="container">

    ```
    <div class="card">

        <h1>Apply for Job</h1>


        <div class="job-info">

            <p>
                <strong>Job Title:</strong>
                <span id="jobTitle">Loading...</span>
            </p>

            <p>
                <strong>Company:</strong>
                <span id="company">Loading...</span>
            </p>

            <p>
                <strong>Location:</strong>
                <span id="location">Loading...</span>
            </p>

        </div>


        <form onsubmit="submitApplication(event)">


            <!-- PERSONAL INFORMATION -->

            <h2>Personal Information</h2>


            <label>Full Name</label>

            <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required>


            <label>Email</label>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>


            <label>Phone Number</label>

            <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required>


            <label>Upload Resume</label>

            <input
                    type="file"
                    id="resume"
                    accept=".pdf,.doc,.docx"
                    required>


            <label>Cover Letter</label>

            <textarea
                    id="coverLetter"
                    placeholder="Write a short message..."></textarea>


            <!-- ADMIN QUESTIONS -->

            <h2>Employer Questions</h2>


            <div class="questions-box">


                <div class="question">

                    <label>
                        1. Do you have experience in this field?
                    </label>

                    <select id="question1" required>

                        <option value="">
                            Select an answer
                        </option>

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <div class="question">

                    <label>
                        2. Are you comfortable working from the required location?
                    </label>

                    <select id="question2" required>

                        <option value="">
                            Select an answer
                        </option>

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <div class="question">

                    <label>
                        3. What is your expected salary?
                    </label>

                    <input
                            type="text"
                            id="question3"
                            placeholder="Example: ₹3 LPA"
                            required>

                </div>


                <div class="question">

                    <label>
                        4. Why should we hire you?
                    </label>

                    <textarea
                            id="question4"
                            placeholder="Write your answer..."
                            required></textarea>

                </div>


            </div>


            <button type="submit">

                🚀 Submit Application

            </button>

        </form>


        <div class="success" id="successMessage">

            ✅ Application submitted successfully!

        </div>

    </div>
    ```

</div>

<script>


    // GET SELECTED JOB

    const jobData = JSON.parse(
        localStorage.getItem("selectedJob")
    );


    // DISPLAY JOB DETAILS

    if (jobData) {


        document
            .getElementById("jobTitle")
            .innerText =

            jobData.title || "Not specified";


        document
            .getElementById("company")
            .innerText =

            jobData.company || "Not specified";


        document
            .getElementById("location")
            .innerText =

            jobData.location || "Not specified";

    }


    // SUBMIT APPLICATION

    function submitApplication(event) {


        event.preventDefault();


        const resume =

            document
                .getElementById("resume")
                .files[0];


        if (!resume) {


            alert(
                "Please upload your resume"
            );


            return;

        }


        const application = {


            title:

            jobData.title,


            company:

            jobData.company,


            location:

            jobData.location,


            name:

            document
                .getElementById("name")
                .value,


            email:

            document
                .getElementById("email")
                .value,


            phone:

            document
                .getElementById("phone")
                .value,


            coverLetter:

            document
                .getElementById("coverLetter")
                .value,


            employerQuestions: {


                experience:

                document
                    .getElementById("question1")
                    .value,


                locationComfort:

                document
                    .getElementById("question2")
                    .value,


                expectedSalary:

                document
                    .getElementById("question3")
                    .value,


                whyHire:

                document
                    .getElementById("question4")
                    .value

            },


            appliedDate:

                new Date()
                    .toLocaleDateString(),


            status:

                "Applied"

        };


        let applications =

            JSON.parse(
                localStorage
                    .getItem("applications")
            ) || [];


        applications.push(application);


        localStorage.setItem(
            "applications",

            JSON.stringify(applications)
        );


        alert(
            "✅ Application submitted successfully!"
        );


        document

            .getElementById(
                "successMessage"
            )

            .style.display = "block";


        document

            .querySelector("form")

            .reset();

    }

</script>

</body>

</html>
