<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications | JOBNOVA</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #2563eb, #6366f1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Plus Jakarta Sans", sans-serif;
        }

        body {
            min-height: 100vh;
            color: var(--text-main);
            background-color: var(--bg-dark);
            background-image:
                    radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                    radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;
            padding: 0 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 13, 22, 0.8);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(16px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: white;
            background: var(--primary-gradient);
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 8px;
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.1);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .admin-btn:hover {
            color: #ffffff;
            background: #6366f1;
            border-color: #6366f1;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #d1d5db;
            background: rgba(255, 255, 255, 0.03);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ================= MAIN CONTAINER ================= */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto 80px;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h1 {
            color: #ffffff;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .page-header p {
            margin-top: 6px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 36px;
        }

        .stat {
            padding: 20px 24px;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
        }

        .stat span {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .stat h2 {
            margin-top: 8px;
            color: #ffffff;
            font-size: 30px;
            font-weight: 700;
        }

        /* ================= APPLICATION CARD ================= */

        .application-card {
            margin-bottom: 20px;
            padding: 28px;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .application-card:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        /* ================= CARD HEADER ================= */

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .job {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .company-logo {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: white;
            background: var(--primary-gradient);
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .job h2 {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .job p {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ================= STATUS BADGES ================= */

        .status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .applied { color: #60a5fa; background: rgba(37, 99, 235, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); }
        .review { color: #f59e0b; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); }
        .shortlisted { color: #a855f7; background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); }
        .interview { color: #06b6d4; background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.3); }
        .selected { color: #10b981; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); }
        .rejected { color: #ef4444; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); }

        /* ================= DETAILS INFO ================= */

        .info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 22px 0;
            padding: 16px 0;
            border-top: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
        }

        .info-item span {
            display: block;
            margin-bottom: 4px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .info-item strong {
            color: #e5e7eb;
            font-size: 13px;
            font-weight: 500;
        }

        /* ================= TRACKER ================= */

        .tracking {
            margin-top: 24px;
        }

        .tracking-title {
            margin-bottom: 16px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .steps {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .steps::before {
            content: "";
            position: absolute;
            top: 14px;
            left: 5%;
            right: 5%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 0;
        }

        .step {
            position: relative;
            z-index: 1;
            text-align: center;
            flex: 1;
        }

        .circle {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            border: 2px solid #374151;
            border-radius: 50%;
            color: #9ca3af;
            background: #111827;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .step.active .circle {
            color: #ffffff;
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
        }

        .step-name {
            color: #6b7280;
            font-size: 11px;
            font-weight: 500;
        }

        .step.active .step-name {
            color: #f3f4f6;
            font-weight: 600;
        }

        /* ================= ADMIN CONTROLS ================= */

        .admin-controls {
            margin-top: 16px;
            padding: 12px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px dashed rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .admin-controls label {
            font-size: 12px;
            font-weight: 700;
            color: #a5b4fc;
        }

        .admin-controls select {
            background: #1e293b;
            color: white;
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        /* ================= BOTTOM FOOTER ================= */

        .bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
        }

        .app-id {
            color: var(--text-muted);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remove-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.05);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .remove-btn:hover {
            color: #ffffff;
            background: #dc2626;
            border-color: #dc2626;
        }

        .rejected-box {
            padding: 14px 18px;
            border-radius: 10px;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ================= EMPTY STATE ================= */

        .empty {
            padding: 80px 20px;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            background: var(--card-bg);
            text-align: center;
        }

        .empty i {
            margin-bottom: 16px;
            color: var(--primary);
            font-size: 48px;
            opacity: 0.8;
        }

        .empty h2 {
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 20px;
        }

        .empty p {
            margin-bottom: 24px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .browse-btn {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 8px;
            color: white;
            background: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .browse-btn:hover {
            background: #2563eb;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 768px) {
            .info {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .steps::before {
                display: none;
            }

            .steps {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .step {
                display: flex;
                align-items: center;
                gap: 12px;
                text-align: left;
            }

            .circle {
                margin: 0;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">
        <div class="logo-icon">
            <i class="fas fa-briefcase"></i>
        </div>
        JOBNOVA
    </div>
    <div class="nav-actions">
        <button id="adminLoginBtn" class="admin-btn" onclick="toggleAdmin()">
            <i class="fas fa-user-shield"></i> <span id="adminBtnText">Admin Login</span>
        </button>
        <a href="/home.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>
    </div>
</nav>

<!-- MAIN -->
<main class="container">

    <div class="page-header">
        <h1>My Applications</h1>
        <p>Track and manage the progress of your active job applications.</p>
    </div>

    <!-- STATS -->
    <div class="stats">
        <div class="stat">
            <span>Total Applications</span>
            <h2 id="totalCount">0</h2>
        </div>
        <div class="stat">
            <span>Under Review</span>
            <h2 id="reviewCount">0</h2>
        </div>
        <div class="stat">
            <span>Shortlisted</span>
            <h2 id="shortlistedCount">0</h2>
        </div>
        <div class="stat">
            <span>Selected</span>
            <h2 id="selectedCount">0</h2>
        </div>
    </div>

    <!-- APPLICATIONS LIST CONTAINER -->
    <div id="applicationsContainer"></div>

</main>

<script>
    const statuses = [
        "Applied",
        "Under Review",
        "Shortlisted",
        "Interview",
        "Selected",
        "Rejected"
    ];

    let isAdmin = false;

    function toggleAdmin() {
        if (!isAdmin) {
            const pass = prompt("Enter Admin Password:");
            if (pass === "admin123") {
                isAdmin = true;
                document.getElementById("adminBtnText").innerText = "Logout Admin";
                alert("Admin Mode Activated!");
            } else if (pass !== null) {
                alert("Incorrect Password!");
            }
        } else {
            isAdmin = false;
            document.getElementById("adminBtnText").innerText = "Admin Login";
            alert("Exited Admin Mode");
        }
        loadApplications();
    }

    function getStatusClass(status) {
        const classes = {
            "Applied": "applied",
            "Under Review": "review",
            "Shortlisted": "shortlisted",
            "Interview": "interview",
            "Selected": "selected",
            "Rejected": "rejected"
        };
        return classes[status] || "applied";
    }

    function getStatusIndex(status) {
        return statuses.indexOf(status);
    }

    function updateStats(applications) {
        document.getElementById("totalCount").innerText = applications.length;
        document.getElementById("reviewCount").innerText = applications.filter(app => app.status === "Under Review").length;
        document.getElementById("shortlistedCount").innerText = applications.filter(app => app.status === "Shortlisted").length;
        document.getElementById("selectedCount").innerText = applications.filter(app => app.status === "Selected").length;
    }

    function updateApplicationStatus(index, newStatus) {
        let applications = JSON.parse(localStorage.getItem("applications")) || [];
        applications[index].status = newStatus;
        localStorage.setItem("applications", JSON.stringify(applications));
        loadApplications();
    }

    function loadApplications() {
        const applications = JSON.parse(localStorage.getItem("applications")) || [];
        const container = document.getElementById("applicationsContainer");

        updateStats(applications);

        if (applications.length === 0) {
            container.innerHTML = `
                    <div class="empty">
                        <i class="fas fa-folder-open"></i>
                        <h2>No Applications Found</h2>
                        <p>You haven't applied to any job positions yet.</p>
                        <a href="/jobs.html" class="browse-btn">Browse Jobs</a>
                    </div>
                `;
            return;
        }

        const trackerStatuses = ["Applied", "Under Review", "Shortlisted", "Interview", "Selected"];

        container.innerHTML = applications.map((app, index) => {
            const currentStatus = app.status || "Applied";
            const currentIndex = trackerStatuses.indexOf(currentStatus);
            const isRejected = currentStatus === "Rejected";
            const appId = app.id || `JOB-${202400 + index}`;

            return `
                    <div class="application-card">
                        <div class="top">
                            <div class="job">
                                <div class="company-logo">
                                    ${(app.company || "C").charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <h2>${app.title || "Job Position"}</h2>
                                    <p>${app.company || "Company Not Specified"} &nbsp;•&nbsp; ${app.location || "Location Not Specified"}</p>
                                </div>
                            </div>
                            <div class="status ${getStatusClass(currentStatus)}">
                                ${currentStatus}
                            </div>
                        </div>

                        <div class="info">
                            <div class="info-item">
                                <span>Applied Date</span>
                                <strong>${app.appliedDate || "Recently"}</strong>
                            </div>
                            <div class="info-item">
                                <span>Applicant Name</span>
                                <strong>${app.name || "N/A"}</strong>
                            </div>
                            <div class="info-item">
                                <span>Contact Email</span>
                                <strong>${app.email || "N/A"}</strong>
                            </div>
                        </div>

                        ${isRejected ? `
                            <div class="rejected-box">
                                <i class="fas fa-circle-xmark"></i>
                                Application was not selected for this role.
                            </div>
                        ` : `
                            <div class="tracking">
                                <div class="tracking-title">Application Progress</div>
                                <div class="steps">
                                    ${trackerStatuses.map((status, statusIndex) => `
                                        <div class="step ${statusIndex <= currentIndex ? "active" : ""}">
                                            <div class="circle">
                                                ${statusIndex <= currentIndex ? '<i class="fas fa-check"></i>' : statusIndex + 1}
                                            </div>
                                            <div class="step-name">${status}</div>
                                        </div>
                                    `).join("")}
                                </div>
                            </div>
                        `}

                        ${isAdmin ? `
                            <div class="admin-controls">
                                <label><i class="fas fa-user-gear"></i> Admin Action: Update Status</label>
                                <select onchange="updateApplicationStatus(${index}, this.value)">
                                    ${statuses.map(s => `
                                        <option value="${s}" ${s === currentStatus ? 'selected' : ''}>${s}</option>
                                    `).join('')}
                                </select>
                            </div>
                        ` : ''}

                        <div class="bottom">
                            <div class="app-id">
                                <i class="fas fa-hashtag" style="font-size: 11px; color: var(--primary);"></i>
                                App ID: <strong style="color: #f3f4f6;">${appId}</strong>
                            </div>
                            <button class="remove-btn" onclick="deleteApplication(${index})">
                                <i class="fas fa-trash-can"></i>
                                Remove
                            </button>
                        </div>
                    </div>
                `;
        }).join("");
    }

    function deleteApplication(index) {
        let applications = JSON.parse(localStorage.getItem("applications")) || [];
        if (confirm("Are you sure you want to remove this application record?")) {
            applications.splice(index, 1);
            localStorage.setItem("applications", JSON.stringify(applications));
            loadApplications();
        }
    }

    loadApplications();
</script>
</body>

</html>
